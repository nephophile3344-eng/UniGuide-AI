<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol - UniGuide AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Kayıt Ol</h1>
      <p class="subtitle">UniGuide AI'a katıl</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label>Ad Soyad</label>
          <input type="text" id="name" required placeholder="Adınız Soyadınız">
        </div>
        
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" id="email" required placeholder="ornek@email.com">
        </div>
        
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="password" required placeholder="En az 6 karakter">
        </div>

        <div class="form-group">
          <label>Şifre Tekrar</label>
          <input type="password" id="passwordConfirm" required placeholder="Şifrenizi tekrar girin">
        </div>

        <button type="submit" class="btn-primary">Kayıt Ol</button>
      </form>

      <p class="toggle-text">
        Zaten hesabın var mı? 
        <a href="login.html">Giriş Yap</a>
      </p>
      
      <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
