<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - UniGuide AI</title>
  <link rel="stylesheet" href="style.css">
</head>                                
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Giriş Yap</h1>
      <p class="subtitle">UniGuide AI hesabına eriş</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label>E-posta</label>
          <input type="email" id="email" required placeholder="ornek@email.com">
        </div>
        
        <div class="form-group">
          <label>Şifre</label>
          <input type="password" id="password" required placeholder="Şifrenizi girin">
        </div>

        <button type="submit" class="btn-primary">Giriş Yap</button>
      </form>

      <p class="toggle-text">
        Hesabın yok mu? 
        <a href="register.html">Kayıt Ol</a>
      </p>
      
      <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>
  </div>

  <!-- DİKKAT: Burası js/login.js olmalı, auth.js değil -->
  <script src="js/login.js"></script>
</body>
</html>
